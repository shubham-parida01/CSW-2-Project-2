{% extends "base.html" %}
{% block title %}Change Password{% endblock %}
{% block content %}
    <h1>Change Password</h1>
    <p>Please use the form below to change your password.</p>
    <form method="post">
        {{ form.as_p }}
        <p>
            <input type="submit" value="Change"></input>
        </p>
        {% csrf_token %}
    </form>
{% endblock %}
